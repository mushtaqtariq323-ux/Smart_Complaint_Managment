<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="AI Fitness Coach — Your Personal AI-Powered Fitness Companion. Personalized workouts, nutrition guidance, progress tracking, and a Fitness Coach — all in one place." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png" />
    <link rel="apple-touch-icon" href="/logo-mark.png" />
    <meta name="theme-color" content="#0e7490" />
    <title>AI Fitness Coach — Your Personal AI-Powered Fitness Companion</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      /* Boot watchdog — kabhi React mount na ho purane/stale bundle ya failed
         module load ki wajah se, black screen ke bajaye friendly reload card
         dikhao. Inline hai is liye module graph ke fail hone par bhi chalta hai. */
      (function () {
        var CLASSES = 'position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:#09090b;font-family:system-ui,sans-serif;color:#fff;text-align:center;padding:24px';
        var html = '<div style="max-width:340px">'
          + '<div style="font-size:40px;margin-bottom:12px">💪</div>'
          + '<h1 style="font-size:18px;font-weight:700;margin:0 0 8px">App failed to load</h1>'
          + '<p style="font-size:13.5px;color:#a1a1aa;margin:0 0 18px;line-height:1.5">Your session or tab went stale. Use the button below for a fresh start — your data is safe.</p>'
          + '<button onclick="location.reload(true)" style="background:linear-gradient(90deg,#a3e635,#10b981);color:#09090b;font-weight:700;font-size:14px;padding:11px 26px;border:0;border-radius:12px;cursor:pointer">🔄 Reload App</button>'
          + '</div>';
        var shown = false, tries = 0;
        function mounted() {
          var r = document.getElementById('root');
          return !!(r && r.children && r.children.length > 0);
        }
        function show() {
          if (shown || document.getElementById('afc-boot-fallback')) return;
          shown = true;
          var el = document.createElement('div');
          el.id = 'afc-boot-fallback';
          el.setAttribute('style', CLASSES);
          el.innerHTML = html;
          document.body.appendChild(el);
          el.style.display = 'flex';
        }
        function hide() {
          var f = document.getElementById('afc-boot-fallback');
          if (f) f.remove();
          shown = false;
        }
        // Har 700ms check: app mount ho gayi? Late mount par card KHUD hat jata hai.
        var iv = setInterval(function () {
          tries += 1;
          if (mounted()) { hide(); clearInterval(iv); return; }
          if (tries === 14) show();            // ~10s → card dikha do
          if (tries > 170) clearInterval(iv);  // ~2min → ruk jao
        }, 700);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
